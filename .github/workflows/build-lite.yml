name: Kizzy Lite APK

on:
  push:
    branches: [ "lite" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kizzy Lite APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.5.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - name: Setup jdk-17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Lite Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK to KizzyLite
        run: cp app/build/outputs/apk/debug/app-debug.apk KizzyLite.apk

      - name: Upload KizzyLite APK
        uses: actions/upload-artifact@v4
        with:
          name: KizzyLite
          path: KizzyLite.apk
